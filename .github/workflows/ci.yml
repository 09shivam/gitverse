# CI — runs on every pull request: install, build (with type-check), test.

name: ci

on:
  pull_request:

# A new push to the same PR cancels the run still in progress for it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Test
        run: npm test
